  labels: { app: session-store }
spec:
  serviceName: session-store
  replicas: 1
  selector: { matchLabels: { app: session-store } }
  template:
    metadata: { labels: { app: session-store } }
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: store
          image: registry.example.com/shop/session-store:7.4.0
          imagePullPolicy: Never
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 40m, memory: 32Mi }
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                printf '{"level":"info","msg":"sessions","live":%d,"evicted":%d}\n' $(( RANDOM % 9000 + 500 )) $(( RANDOM % 40 ))
                sleep $(( RANDOM % 4 + 1 ))
              done
