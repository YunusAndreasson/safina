version: "2"

run:
  timeout: 5m

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - intrange
    - loggercheck
    - makezero
    - musttag
    - nosprintfhostport
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - rowserrcheck
    - sqlclosecheck
    - sloglint
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usetesting
    - wastedassign

  exclusions:
    warn-unused: true

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # Struct padding is measured through benchmarks, not a correctness gate.
    errcheck:
      check-type-assertions: true
    exhaustive:
      default-signifies-exhaustive: false
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    gosec:
      excludes:
        - G104   # errcheck already covers unchecked errors

formatters:
  enable:
    - gofumpt
