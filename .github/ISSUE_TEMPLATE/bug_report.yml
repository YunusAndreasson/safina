name: Bug report
description: Something in safina doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what safina did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Open a cluster with …
        2. Press …
  - type: input
    id: version
    attributes:
      label: safina version
      description: The output of `safina --version`.
      placeholder: safina version v0.1.0
    validations:
      required: true
  - type: input
    id: kubernetes
    attributes:
      label: Kubernetes version
      description: The server version from `kubectl version`, and the distribution if you know it (EKS, GKE, k3s…).
  - type: input
    id: terminal
    attributes:
      label: Terminal and OS
      placeholder: Ghostty 1.3 on Arch Linux, inside tmux
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Errors are kept in ~/.safina/errors.log; run with SAFINA_DEBUG=1 for a
        fuller ~/.safina/debug.log. Read them for cluster names, hostnames and
        secrets before you paste.
      render: text
