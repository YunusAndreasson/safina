# Puts site/ live on every push to main that touches it, or by hand from the
# Actions tab: the same gate as lint.yml's site job (`pnpm verify`, which
# builds dist/), then `pnpm ship`, which guards the Worker name, uploads,
# checks the edge serves exactly this build and rolls back if it doesn't.
# The Worker is static files only (site/wrangler.jsonc); site/README.md
# §Deploy has the setup.
name: deploy-site
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:
permissions:
  contents: read
# One deploy at a time, and never cut off half way: a newer push waits for
# the running one, so the last push is the one that ends up live.
concurrency:
  group: deploy-site
  cancel-in-progress: false
jobs:
  # A fork, or this repository before its secrets are set, has nothing to
  # deploy with: the deploy job is then skipped with a notice, not failed.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deployed: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID aren't both set (site/README.md §Deploy)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: secrets
    if: needs.secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - name: Install pinned package manager
        working-directory: site
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm verify
        working-directory: site
      - name: Ship
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: pnpm ship
